<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raid Rotator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <h1>World of Warcraft Raid Team Rotator by James</h1>
  <div id="upload-section">
    <h2>Upload Sign-ups CSV</h2>
    <input type="file" id="csvFile" accept=".csv">
    <button id="loadBtn">Load Sign-ups</button>
  </div>
  <div id="signups-list" style="display: none;">
    <h2>Current Sign-ups</h2>
    <h3>Tanks</h3>
    <ul id="tanks-ul"></ul>
    <h3>Healers</h3>
    <ul id="healers-ul"></ul>
    <h3>DPS</h3>
    <ul id="dps-ul"></ul>
  </div>
  <div id="rotate-section" style="display: none;">
    <button id="rotateBtn" type="button">Rotate Team</button>
    <div id="status" class="status"></div>
  </div>
  <div id="results" style="display: none;">
    <h2 id="selected-title">Selected Team (25)</h2>
    <h3>Tanks (3)</h3>
    <ul id="selected-tanks-ul"></ul>
    <h3>Healers (5)</h3>
    <ul id="selected-healers-ul"></ul>
    <h3>DPS (17)</h3>
    <ul id="selected-dps-ul"></ul>
    <h2 id="bench-title">Benched</h2>
    <h3>Tanks</h3>
    <ul id="benched-tanks-ul"></ul>
    <h3>Healers</h3>
    <ul id="benched-healers-ul"></ul>
    <h3>DPS</h3>
    <ul id="benched-dps-ul"></ul>
    <button id="saveBtn">Save Results</button>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
